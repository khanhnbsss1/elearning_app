plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def flutterCompileSdkVersion = localProperties.getProperty('flutter.compileSdkVersion')
if (flutterCompileSdkVersion == null) {
    flutterCompileSdkVersion = 34
}
def flutterMinSdkVersion = localProperties.getProperty('flutter.minSdkVersion')
if (flutterMinSdkVersion == null) {
    flutterMinSdkVersion = 31
}
def flutterTargetSdkVersion = localProperties.getProperty('flutter.targetSdkVersion')
if (flutterTargetSdkVersion == null) {
    flutterTargetSdkVersion = 34
}

def YAXChineseLearningName = localProperties.getProperty('flutter.YAXChineseLearningName')
if (YAXChineseLearningName == null) {
    YAXChineseLearningName = "YAX Chinese Learning"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.fft_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
/*    packagingOptions {
        jniLibs {
            useLegacyPackaging true // Enabling flag to compress JNI Libs to reduce APK size Ref: https://developer.android.com/studio/releases/gradle-plugin#compress-native-libs-dsl
        }
    }*/
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.FFTCompany.YAXChineseLearning"
        minSdkVersion flutterMinSdkVersion.toInteger()
        targetSdkVersion flutterTargetSdkVersion.toInteger()
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        resConfigs 'en', 'Us', 'vi', 'Vn'
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            storeFile file("../../keys/androidKey/fft_navi_tracking.jks")
            storePassword "fft@123456"
            keyAlias "FFT_TRACKING"
            keyPassword "fft@123456"
            // Optional, specify signing versions used
            v1SigningEnabled true
            v2SigningEnabled true
        }
        releaseYAXChineseLearning {
            storeFile file("../../keys/androidKey/" +
                    "" +
                    "" +
                    ".jks")
            storePassword "fft@123456"
            keyAlias "FFT_TRACKING"
            keyPassword "fft@123456"
            // Optional, specify signing versions used
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {

        debug{
            signingConfig signingConfigs.release
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            aaptOptions.cruncherEnabled = true
            minifyEnabled false
            shrinkResources false /// enable de build lib ceiba trong release mode
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions = ["app"]
    productFlavors {
        def flavorSTouchSigningVariable = signingConfigs.releaseYAXChineseLearning
        YAXChineseLearning {
            dimension "app"
            applicationId "com.FFTCompany.YAXChineseLearning"
            resValue "string", "app_name", YAXChineseLearningName
            signingConfig flavorSTouchSigningVariable
        }
    }
}

flutter {
    source = "../.."
}
