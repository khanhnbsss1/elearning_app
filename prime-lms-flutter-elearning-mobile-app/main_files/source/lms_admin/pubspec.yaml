name: lms_admin
description: A new Flutter project.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.3+4

environment:
  sdk: '>=3.0.5 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_strategy: ^0.2.0
  flutter_riverpod: ^2.5.1
  svg_flutter: ^0.0.1
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  animated_flip_counter: ^0.3.4
  image_picker: ^1.1.2
  url_launcher: ^6.3.0
  firebase_storage: ^12.0.0
  fluttertoast: ^8.2.6
  firebase_ui_firestore: ^1.6.3
  cached_network_image: ^3.3.1
  pointer_interceptor: ^0.10.1+1
  data_table_2: ^2.5.12
  flutter_html: ^3.0.0-beta.2
  html_editor_enhanced: ^2.6.0
  line_icons: ^2.0.3
  youtube_parser: ^2.1.4
  flutter_rating_bar: ^4.0.1
  html_unescape: ^2.0.0
  fl_chart: ^0.68.0
  http: ^1.2.1
  googleapis_auth: ^1.6.0
  rounded_loading_button:
    git:
      url: https://github.com/scopendo/flutter_rounded_loading_button.git
      ref: master

dependency_overrides:
  cloud_firestore: ^5.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/google_fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/google_fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Poppins-ExtraBold.ttf
          weight: 800

